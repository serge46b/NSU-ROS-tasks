name: ROS checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
      COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate environment JSON
        shell: bash
        run: python3 -m json.tool evidence/pr01/environment.json > /dev/null
      - name: Download course kit
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --retry 5 --retry-delay 2 --retry-all-errors --http1.1 -4 \
            -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"; then
            python3 -c 'import os, urllib.request; urllib.request.urlretrieve(os.environ["COURSE_KIT_URL"], "/tmp/course-kit.tar.gz")'
          fi
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p /tmp/course-kit
          tar -xzf /tmp/course-kit.tar.gz -C /tmp/course-kit
      - name: Check PR evidence
        shell: bash
        run: python3 /tmp/course-kit/v1/tools/check_practice.py PR03 --submission .
